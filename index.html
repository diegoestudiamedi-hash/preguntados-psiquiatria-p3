<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PsiquiaTriv - Preguntados Psiquiatría UCM</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 15px;
    }

    header {
      width: 100%;
      max-width: 900px;
      background: var(--card-bg);
      padding: 16px 24px;
      border-radius: 16px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.35);
      margin-bottom: 20px;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand h1 {
      font-size: 1.5rem;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 800;
    }

    .stats-bar {
      display: flex;
      gap: 18px;
      align-items: center;
      font-weight: 700;
      font-size: 1.05rem;
    }

    .stat-pill {
      background: rgba(15, 23, 42, 0.7);
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.1);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .score-text {
      color: var(--warning);
    }

    .progress-container {
      width: 100%;
      background: #0f172a;
      height: 12px;
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #38bdf8, #22c55e);
      transition: width 0.4s ease;
    }

    .main-container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .wheel-section {
      background: var(--card-bg);
      width: 100%;
      padding: 25px;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.08);
      position: relative;
    }

    .wheel-wrapper {
      position: relative;
      width: 340px;
      height: 340px;
      margin: 15px auto;
    }

    @media (min-width: 500px) {
      .wheel-wrapper {
        width: 400px;
        height: 400px;
      }
    }

    canvas#wheelCanvas {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      box-shadow: 0 0 25px rgba(0,0,0,0.6);
      transition: transform 4s cubic-bezier(0.15, 0.85, 0.25, 1);
    }

    .wheel-pointer {
      position: absolute;
      top: -16px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 18px solid transparent;
      border-right: 18px solid transparent;
      border-top: 34px solid #f8fafc;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.6));
      z-index: 10;
    }

    .spin-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 82px;
      height: 82px;
      border-radius: 50%;
      background: #0f172a;
      color: #fff;
      border: 4px solid #f8fafc;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 6px 15px rgba(0,0,0,0.6);
      z-index: 10;
      transition: transform 0.15s ease, background 0.2s;
    }

    .spin-btn:hover:not(:disabled) {
      transform: translate(-50%, -50%) scale(1.06);
      background: #1e293b;
    }

    .spin-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .category-legend {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 10px;
      width: 100%;
      margin-top: 15px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      background: rgba(15, 23, 42, 0.6);
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.05);
      transition: transform 0.15s, border-color 0.2s;
    }

    .legend-item:hover {
      transform: translateY(-2px);
      border-color: rgba(255,255,255,0.25);
    }

    .legend-color {
      width: 14px;
      height: 14px;
      border-radius: 4px;
      flex-shrink: 0;
    }

    /* Modal de Pregunta */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(5px);
      display: none;
      justify-content: center;
      align-items: center;
      padding: 16px;
      z-index: 100;
    }

    .modal-overlay.active {
      display: flex;
    }

    .question-card {
      background: var(--card-bg);
      width: 100%;
      max-width: 680px;
      border-radius: 20px;
      padding: 26px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.12);
      max-height: 92vh;
      overflow-y: auto;
      animation: popIn 0.25s ease-out;
    }

    @keyframes popIn {
      from { transform: scale(0.92); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .category-badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 14px;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .question-text {
      font-size: 1.18rem;
      line-height: 1.5;
      margin-bottom: 20px;
      font-weight: 600;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-btn {
      background: #0f172a;
      color: var(--text-main);
      border: 2px solid rgba(255,255,255,0.1);
      padding: 14px 18px;
      border-radius: 12px;
      text-align: left;
      font-size: 1rem;
      line-height: 1.4;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--accent);
      background: rgba(56, 189, 248, 0.1);
    }

    .option-btn.correct {
      background: rgba(34, 197, 94, 0.2);
      border-color: var(--success);
      color: #bbf7d0;
    }

    .option-btn.wrong {
      background: rgba(239, 68, 68, 0.2);
      border-color: var(--danger);
      color: #fecaca;
    }

    .option-letter {
      font-weight: 800;
      color: var(--accent);
      min-width: 22px;
    }

    .feedback-box {
      margin-top: 20px;
      padding: 16px;
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.9);
      border-left: 5px solid var(--accent);
      display: none;
      line-height: 1.5;
      font-size: 0.95rem;
    }

    .feedback-box.active {
      display: block;
    }

    .feedback-title {
      font-weight: 800;
      margin-bottom: 6px;
      font-size: 1.05rem;
    }

    .next-btn, .restart-btn {
      margin-top: 18px;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(90deg, #38bdf8, #6366f1);
      color: white;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .next-btn:hover, .restart-btn:hover {
      opacity: 0.92;
    }

    .helper-text {
      color: var(--text-muted);
      font-size: 0.9rem;
      text-align: center;
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-top">
      <div class="brand">
        <span style="font-size: 1.8rem;">🧠</span>
        <div>
          <h1>PsiquiaTriv UCM</h1>
          <div style="font-size: 0.8rem; color: var(--text-muted);">Meta: 5000 pts (+100 pts por acierto)</div>
        </div>
      </div>
      <div class="stats-bar">
        <div class="stat-pill" id="livesDisplay" title="Vidas restantes">❤️❤️❤️</div>
        <div class="stat-pill score-text">⭐ <span id="scoreValue">0</span> / 5000</div>
        <button onclick="resetGame()" style="background:transparent; border:1px solid #475569; color:#cbd5e1; padding:6px 12px; border-radius:8px; cursor:pointer; font-size:0.85rem;">Reiniciar</button>
      </div>
    </div>
    <div class="progress-container">
      <div class="progress-fill" id="progressBar"></div>
    </div>
  </header>

  <main class="main-container">
    <section class="wheel-section">
      <div class="wheel-wrapper">
        <div class="wheel-pointer"></div>
        <canvas id="wheelCanvas" width="500" height="500"></canvas>
        <button class="spin-btn" id="spinBtn" onclick="spinWheel()">GIRAR</button>
      </div>
      <p class="helper-text">Gira la ruleta para obtener una pregunta aleatoria o haz clic directamente en una categoría debajo para practicarla.</p>
      <div class="category-legend" id="categoryLegend"></div>
    </section>
  </main>

  <!-- Modal de Pregunta -->
  <div class="modal-overlay" id="questionModal">
    <div class="question-card">
      <span class="category-badge" id="modalCategoryBadge">Categoría</span>
      <div class="question-text" id="modalQuestionText">¿Pregunta?</div>
      <div class="options-list" id="modalOptionsList"></div>
      <div class="feedback-box" id="modalFeedbackBox">
        <div class="feedback-title" id="modalFeedbackTitle"></div>
        <div id="modalFeedbackText"></div>
      </div>
      <button class="next-btn" id="modalNextBtn" style="display:none;" onclick="closeQuestionModal()">Continuar</button>
    </div>
  </div>

  <!-- Modal de Fin de Juego / Victoria -->
  <div class="modal-overlay" id="endModal">
    <div class="question-card" style="text-align: center;">
      <div id="endEmoji" style="font-size: 4rem; margin-bottom: 10px;">🏆</div>
      <h2 id="endTitle" style="font-size: 1.8rem; margin-bottom: 10px;">¡Felicidades!</h2>
      <p id="endMessage" style="color: var(--text-muted); margin-bottom: 20px; line-height: 1.5;"></p>
      <button class="restart-btn" onclick="resetGame()">Jugar una nueva partida</button>
    </div>
  </div>

  <script>
    const categories = [
      { id: 0, name: "Control de Impulsos", short: "Impulsos", color: "#ef4444" },
      { id: 1, name: "T. de Personalidad", short: "Personalidad", color: "#8b5cf6" },
      { id: 2, name: "Uso de Sustancias", short: "Sustancias", color: "#f59e0b" },
      { id: 3, name: "Conducta Alimentaria", short: "TCA", color: "#10b981" },
      { id: 4, name: "Psicogeriatría", short: "Psicogeriatría", color: "#3b82f6" },
      { id: 5, name: "Urgencias Psiquiátricas", short: "Urgencias", color: "#ec4899" },
      { id: 6, name: "Síntomas Somáticos", short: "Somáticos", color: "#14b8a6" },
      { id: 7, name: "Red de Salud", short: "Red de Salud", color: "#6366f1" }
    ];

    const questionBank = {
      0: [ // Trastorno de Control de Impulsos (Clase 18)
        {
          q: "Respecto a las bases neurobiológicas y hormonales implicadas en la génesis de los impulsos (Clase 18), ¿qué perfil se asocia directamente con una mayor impulsividad?",
          options: [
            "Aumento de serotonina (5-HT) central y disminución de dopamina",
            "Disminución de serotonina (<5-HT), aumento de noradrenalina (NA) y dopamina (DA) centrales, e influencia de testosterona",
            "Hipoactividad dopaminérgica en el núcleo accumbens e hiperactividad gabaérgica",
            "Aumento exclusivo de acetilcolina y disminución de testosterona plasmática"
          ],
          correct: 1,
          feedback: "En el modelo multifactorial de los impulsos, los factores neurobiológicos incluyen baja serotonina (<5-HT), aumento de noradrenalina (>NA) y dopamina (DA) centrales, además de factores hormonales como la testosterona."
        },
        {
          q: "Al describir la personalidad en relación con el control de impulsos, ¿cuál es la diferencia entre temperamento y carácter?",
          options: [
            "El temperamento se adquiere por la crianza y el carácter es 100% genético",
            "El temperamento está ligado a lo biológico/hereditario, mientras que el carácter se relaciona con las defensas psicológicas, la crianza y cómo se lidia con las normas",
            "Ambos conceptos son sinónimos y dependen exclusivamente del entorno escolar",
            "El carácter aparece en la infancia temprana y el temperamento recién en la adultez"
          ],
          correct: 1,
          feedback: "El temperamento corresponde al sustrato biológico y hereditario, mientras que el carácter se moldea con la crianza, las defensas psicológicas adquiridas y el aprendizaje para manejar los propios impulsos frente a las normas sociales."
        },
        {
          q: "¿Cuál es la dinámica central del ciclo de la conducta impulsiva (como en la cleptomanía o la piromanía) respecto al estado afectivo del sujeto?",
          options: [
            "Ausencia de tensión previa seguida de una planificación fría para obtener lucro económico",
            "Tensión interna creciente previa al acto (similar al craving), seguida de una sensación temporal de alivio o liberación de tensión al ejecutar la conducta",
            "Bienestar continuo antes, durante y meses después de realizar la acción sin consecuencias negativas",
            "Presencia de alucinaciones auditivas que ordenan realizar el robo o incendio"
          ],
          correct: 1,
          feedback: "En los trastornos del control de impulsos existe una tensión creciente previa a la conducta y, al ejecutarla, lo que se experimenta es principalmente un alivio temporal de esa tensión interna acumulada."
        },
        {
          q: "Según los criterios DSM-5 revisados en clases para el Trastorno Oposicionista Desafiante (TOD), ¿cuántos síntomas y por cuánto tiempo mínimo deben presentarse?",
          options: [
            "Al menos 2 de 5 síntomas durante 1 mes",
            "Al menos 4 de los 8 síntomas (enfado/irritabilidad, actitud desafiante, vengativo) durante al menos 6 meses",
            "Al menos 6 síntomas de agresión física severa a animales durante 12 meses",
            "1 síntoma aislado de discusión con adultos en las últimas 2 semanas"
          ],
          correct: 1,
          feedback: "El TOD requiere un patrón persistente de al menos 4 de los 8 síntomas divididos en enfado/irritabilidad, discusiones/actitud desafiante y ser vengativo, con una duración mínima de 6 meses."
        },
        {
          q: "En el Trastorno Oposicionista Desafiante y en el Trastorno de Conducta, ¿qué hallazgos fisiológicos se asocian a un peor pronóstico?",
          options: [
            "Taquicardia sinusal permanente e hipercortisolismo reactivo extremo",
            "Frecuencia cardíaca basal baja en reposo y menor reactividad fisiológica/del cortisol frente al estrés",
            "Aumento marcado de la presión arterial diastólica ante estímulos neutros",
            "Hiperreactividad autonómica con sudoración profusa ante cualquier norma"
          ],
          correct: 1,
          feedback: "Una frecuencia cardíaca basal baja y una reactividad reducida del cortisol basal sugieren una menor respuesta fisiológica de estrés ante estímulos que normalmente alertarían o frenarían a otras personas."
        },
        {
          q: "Un paciente presenta episodios abruptos y desproporcionados de agresión (ej. golpear a un mecánico porque estima que su auto quedó mal arreglado), comportándose de forma aceptable el resto del tiempo. ¿Qué fármacos se mencionan con utilidad para contener esta descarga?",
          options: [
            "Solo metilfenidato en dosis altas",
            "Estabilizadores del ánimo, ISRS y betabloqueadores como propranolol (además de psicoterapia)",
            "Antidepresivos tricíclicos y levodopa",
            "Disulfiram y donepezilo"
          ],
          correct: 1,
          feedback: "En el Trastorno Explosivo Intermitente, además de psicoterapia para reconocer gatillantes y rabia, los estabilizadores del ánimo, ISRS y el propranolol han mostrado utilidad para contener la descarga adrenérgica."
        },
        {
          q: "Respecto a la Cleptomanía, ¿cuál de las siguientes afirmaciones sobre su clínica, epidemiología y manejo es correcta?",
          options: [
            "Se roban objetos de alto valor económico para venderlos; es 90% más frecuente en hombres",
            "Casi 2/3 son mujeres, se roban objetos que no se necesitan o de poco valor económico por dificultad para resistir el impulso, y en su manejo se usan ISRS, naltrexona y terapia conductual",
            "Es una conducta completamente consciente motivada por venganza hacia el dueño de la tienda",
            "Su prevalencia es del 25% de la población general y se resuelve espontáneamente en 1 semana"
          ],
          correct: 1,
          feedback: "En la cleptomanía casi dos tercios son mujeres, no hay motivación económica ni de venganza, y farmacológicamente se utilizan ISRS y naltrexona (antagonista opioide que bloquea el refuerzo positivo)."
        },
        {
          q: "¿Qué cambio clasificatorio ocurrió con la Tricotilomanía en el DSM-5 y qué tratamiento local se ha utilizado cuando el paciente refiere una sensación de 'comezón' previa a arrancarse el cabello?",
          options: [
            "Pasó al grupo de trastornos psicóticos y se trata con haloperidol tópico",
            "Se incluyó dentro de los trastornos obsesivo-compulsivos y relacionados; cuando hay prurito/comezón previa se han utilizado corticoides locales además de TCC e ISRS",
            "Pasó a trastornos neurocognitivos y se maneja con memantina",
            "Se eliminó del DSM-5 por considerarse una variante normal sin tratamiento"
          ],
          correct: 1,
          feedback: "En el DSM-5 la tricotilomanía pasó al espectro obsesivo-compulsivo (junto al trastorno de excoriación/skin picking). El pilar es la TCC, uso de ISRS y, si hay sensación de comezón previa, corticoides tópicos."
        }
      ],
      1: [ // Trastorno de Personalidad (Clase 23)
        {
          q: "Un estudiante piensa que cuando el profesor elige a otro compañero para una actividad es 'porque le tiene mala', y si sus amigos se reúnen sin él cree que 'quieren perjudicarlo para que le vaya mal'. ¿A qué trastorno y Cluster corresponde?",
          options: [
            "Trastorno Esquizoide - Cluster A",
            "Trastorno Paranoide de la Personalidad - Cluster A",
            "Trastorno Evitativo - Cluster C",
            "Trastorno Límite - Cluster B"
          ],
          correct: 1,
          feedback: "El Trastorno Paranoide (Cluster A, 'extraños') se caracteriza por una desconfianza y suspicacia sostenida hacia los demás, interpretando sus intenciones como malévolas o con motivos ocultos."
        },
        {
          q: "¿Cómo se diferencia clínicamente el Trastorno Límite de la Personalidad (TLP) del Trastorno Bipolar en relación con los cambios anímicos?",
          options: [
            "En el TLP los episodios duran mínimo 6 meses y en el trastorno bipolar duran minutos",
            "En el TLP los cambios son emocionales, puntiformes y ocurren de un momento a otro en el mismo día (reactivos), mientras que en el trastorno bipolar son episodios del humor estables que duran semanas o meses",
            "No existe diferencia clínica; ambos son el mismo diagnóstico en el DSM-5",
            "El TLP siempre cursa con alucinaciones visuales crónicas y el bipolar no"
          ],
          correct: 1,
          feedback: "El humor es estable (los episodios afectivos bipolares duran semanas o meses con periodos de eutimia), mientras que en el TLP predomina la inestabilidad afectiva con cambios emocionales rápidos en horas o de un día para otro."
        },
        {
          q: "Según el diagnóstico estructural de Otto Kernberg, ¿cuáles son los 3 criterios principales para clasificar la organización de personalidad en Neurótica, Limítrofe o Psicótica?",
          options: [
            "Coeficiente intelectual, memoria de trabajo y atención dividida",
            "Prueba de realidad, Mecanismos de defensa e Integración de la identidad",
            "Nivel socioeconómico, antecedentes familiares y respuesta a ISRS",
            "Extroversión, amabilidad y apertura a la experiencia"
          ],
          correct: 1,
          feedback: "Kernberg evalúa tres pilares: Prueba de realidad (conservada en OP neurótica y limítrofe, alterada en psicótica), Mecanismos de defensa (represión en neurótica vs. escisión en limítrofe/psicótica) e Identidad (integrada en neurótica vs. difusión de identidad en limítrofe/psicótica)."
        },
        {
          q: "Dentro del acrónimo RADIOS utilizado para la evaluación estructural de la personalidad, ¿qué significan sus siglas?",
          options: [
            "Rapidez, Atención, Delirio, Inteligencia, Orientación y Sueño",
            "Realidad (prueba de realidad), Agresividad, Defensas, Identidad, Relaciones Objetales y Superyó",
            "Riesgo, Ansiedad, Depresión, Impulsividad, Obsesión y Somatización",
            "Reactividad, Afecto, Discurso, Insight, Obediencia y Sociabilidad"
          ],
          correct: 1,
          feedback: "RADIOS evalúa: Realidad, Agresividad (incluyendo heteroagresividad o parasitismo), Defensas (altas vs bajas/escisión), Identidad, Relaciones Objetales y Superyó."
        },
        {
          q: "Un paciente de 38 años lleva 4 años con licencia médica sin patología orgánica actual, vive gratis en casa de su exsuegra, no trabaja ni ayuda en el hogar y amenaza implícitamente con suicidarse si dejan de mantenerlo. Según el modelo estructural, esto ejemplifica:",
          options: [
            "Mecanismo de defensa de sublimación y altruismo con organización neurótica",
            "Conducta pasivo-parasitaria (alta agresividad) y relaciones objetales explotadoras en una organización limítrofe de bajo nivel",
            "Superyó excesivamente rígido propio de un trastorno obsesivo-compulsivo",
            "Personalidad normal con adaptación flexible al estrés"
          ],
          correct: 1,
          feedback: "Vivir a costa de los demás sin contribuir pudiendo hacerlo constituye una conducta pasivo-parasitaria (manifestación de agresividad alta) con vínculos explotadores y manipuladores, propio de una OLP de bajo nivel."

    const canvas = document.getElementById("wheelCanvas");
    const ctx = canvas.getContext("2d");

    function drawWheel() {
      const numSlices = categories.length;
      const arc = (2 * Math.PI) / numSlices;
      const radius = canvas.width / 2;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < numSlices; i++) {
        const angle = i * arc;
        ctx.beginPath();
        ctx.fillStyle = categories[i].color;
        ctx.moveTo(radius, radius);
        ctx.arc(radius, radius, radius - 8, angle, angle + arc);
        ctx.lineTo(radius, radius);
        ctx.fill();

        ctx.lineWidth = 3;
        ctx.strokeStyle = "#0f172a";
        ctx.stroke();

        // Texto de cada categoría
        ctx.save();
        ctx.translate(radius, radius);
        ctx.rotate(angle + arc / 2);
        ctx.textAlign = "right";
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 17px 'Segoe UI', sans-serif";
        ctx.shadowColor = "rgba(0,0,0,0.6)";
        ctx.shadowBlur = 4;
        ctx.fillText(categories[i].short, radius - 28, 6);
        ctx.restore();
      }

      // Borde exterior
      ctx.beginPath();
      ctx.arc(radius, radius, radius - 4, 0, 2 * Math.PI);
      ctx.lineWidth = 8;
      ctx.strokeStyle = "#f8fafc";
      ctx.stroke();
    }

        legend.appendChild(div);
      });
    }

      const pct = Math.min(100, (score / targetScore) * 100);
      document.getElementById("progressBar").style.width = pct + "%";
      document.getElementById("livesDisplay").textContent = "❤️".repeat(lives) + "🖤".repeat(3 - lives);
    }

    function spinWheel() {
      if (isSpinning || lives <= 0 || score >= targetScore) return;
      isSpinning = true;
      document.getElementById("spinBtn").disabled = true;

      const extraSpins = 5 + Math.floor(Math.random() * 4);
      const randomDegree = Math.floor(Math.random() * 360);
      const totalDelta = extraSpins * 360 + randomDegree;
      currentRotation += totalDelta;

      canvas.style.transform = `rotate(${currentRotation}deg)`;

      setTimeout(() => {
        isSpinning = false;
        document.getElementById("spinBtn").disabled = false;

        // El puntero está arriba (270 grados en coordenadas estándar del canvas)
        const normalizedDeg = currentRotation % 360;
        const pointerAngle = (270 - normalizedDeg + 360) % 360;
        const sliceIndex = Math.floor(pointerAngle / (360 / categories.length));

        openCategoryQuestion(sliceIndex);
      }, 4100);
    }

    function openCategoryQuestion(catId) {
      const cat = categories[catId];
      const pool = questionBank[catId];

      // Si ya se respondieron las 8 preguntas de esta categoría, reiniciamos su mazo para seguir jugando hasta 5000 pts
      if (usedQuestions[catId].length >= pool.length) {
        usedQuestions[catId] = [];
      }

      const availableIndices = pool
        .map((_, idx) => idx)
        .filter(idx => !usedQuestions[catId].includes(idx));

      const chosenIndex = availableIndices[Math.floor(Math.random() * availableIndices.length)];
      usedQuestions[catId].push(chosenIndex);

      const qObj = pool[chosenIndex];

      const badge = document.getElementById("modalCategoryBadge");
      badge.textContent = cat.name;
      badge.style.backgroundColor = cat.color;

      document.getElementById("modalQuestionText").textContent = qObj.q;

      const optionsContainer = document.getElementById("modalOptionsList");
      optionsContainer.innerHTML = "";

      // Mezclar el orden de las alternativas para que el estudio sea activo
      const indexedOptions = qObj.options.map((text, idx) => ({
        text,
        isCorrect: idx === qObj.correct
      }));
      for (let i = indexedOptions.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [indexedOptions[i], indexedOptions[j]] = [indexedOptions[j], indexedOptions[i]];
      }

      const letters = ["A", "B", "C", "D"];
      indexedOptions.forEach((opt, idx) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerHTML = `<span class="option-letter">${letters[idx]}.</span> <span>${opt.text}</span>`;
        btn.onclick = () => selectAnswer(btn, opt.isCorrect, indexedOptions, qObj.feedback);
        optionsContainer.appendChild(btn);
      });

      const fbBox = document.getElementById("modalFeedbackBox");
      fbBox.classList.remove("active");
      document.getElementById("modalNextBtn").style.display = "none";
      document.getElementById("questionModal").classList.add("active");
    }

    function selectAnswer(selectedBtn, isCorrect, indexedOptions, feedbackText) {
      const allBtns = document.querySelectorAll("#modalOptionsList .option-btn");
      allBtns.forEach((btn, idx) => {
        btn.disabled = true;
        if (indexedOptions[idx].isCorrect) {
          btn.classList.add("correct");
        }
      });

      const fbBox = document.getElementById("modalFeedbackBox");
      const fbTitle = document.getElementById("modalFeedbackTitle");
      const fbText = document.getElementById("modalFeedbackText");

      if (isCorrect) {
        selectedBtn.classList.add("correct");
        score += 100;
        fbBox.style.borderLeftColor = "#22c55e";
        fbTitle.style.color = "#4ade80";
        fbTitle.textContent = "✅ ¡Respuesta Correcta! (+100 puntos)";
      } else {
        selectedBtn.classList.add("wrong");
        lives -= 1;
        fbBox.style.borderLeftColor = "#ef4444";
        fbTitle.style.color = "#f87171";
        fbTitle.textContent = "❌ Respuesta Incorrecta (-1 vida)";
      }

      fbText.textContent = feedbackText;
      fbBox.classList.add("active");
      document.getElementById("modalNextBtn").style.display = "block";
      updateHUD();
    }

    function closeQuestionModal() {
      document.getElementById("questionModal").classList.remove("active");

      if (score >= targetScore) {
        showEndScreen(true);
      } else if (lives <= 0) {
        showEndScreen(false);
      }
    }

    function showEndScreen(isVictory) {
      const endModal = document.getElementById("endModal");
      const emoji = document.getElementById("endEmoji");
      const title = document.getElementById("endTitle");
      const msg = document.getElementById("endMessage");

      if (isVictory) {
        emoji.textContent = "🏆";
        title.textContent = "¡Meta de 5000 Puntos Alcanzada!";
        msg.textContent = `¡Excelente dominio de Psiquiatría! Lograste alcanzar los ${score} puntos conservando ${lives} vida(s).`;
      } else {
        emoji.textContent = "💔";
        title.textContent = "Te has quedado sin vidas";
        msg.textContent = `Alcanzaste un puntaje de ${score} / ${targetScore} puntos. ¡Repasa las retroalimentaciones y vuelve a intentarlo!`;
      }

      endModal.classList.add("active");
    }

    function resetGame() {
      score = 0;
      lives = 3;
      usedQuestions = { 0: [], 1: [], 2: [], 3: [], 4: [], 5: [], 6: [], 7: [] };
      document.getElementById("questionModal").classList.remove("active");
      document.getElementById("endModal").classList.remove("active");
      updateHUD();
    }

    // Inicialización
    drawWheel();
    renderLegend();
    updateHUD();
  </script>
</body>
</html>
